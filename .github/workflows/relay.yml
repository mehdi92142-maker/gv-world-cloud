name: relay-to-huggingface
on:
  push:
    branches: ['out-*']
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relay-all
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q huggingface_hub==0.36.0
      - name: relay every pending out-* branch in batched commits
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: python relay_all.py
